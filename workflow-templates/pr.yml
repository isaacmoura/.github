name: pr
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr:
    uses: isaacmoura/workflows/.github/workflows/pr-checks.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: write
